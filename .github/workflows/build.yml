name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build & smoke test
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Build release (universal)
        run: ./scripts/build-release.sh

      - name: Smoke test
        run: |
          BIN=build/release/class-dump
          lipo -info "$BIN"
          "$BIN" --version
          # Compile a tiny Objective-C binary with the current toolchain (which emits
          # relative method lists / chained fixups) and confirm class-dump parses it.
          cat > /tmp/cdsmoke.m <<'EOF'
          #import <Foundation/Foundation.h>
          @interface CDSmokeObject : NSObject
          @property(nonatomic, copy) NSString *smokeName;
          - (void)smokeMethodWithValue:(NSInteger)value;
          @end
          @implementation CDSmokeObject
          - (void)smokeMethodWithValue:(NSInteger)value {}
          @end
          int main(void) { return 0; }
          EOF
          clang -fobjc-arc -framework Foundation -o /tmp/cdsmoke /tmp/cdsmoke.m
          "$BIN" /tmp/cdsmoke | tee /tmp/cdsmoke.h
          grep -q "@interface CDSmokeObject : NSObject" /tmp/cdsmoke.h
          grep -q "smokeMethodWithValue:" /tmp/cdsmoke.h
          echo "Smoke test passed."

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: class-dump
          path: build/release/class-dump
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release (universal)
        run: ./scripts/build-release.sh

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/class-dump-*.zip
          generate_release_notes: true
